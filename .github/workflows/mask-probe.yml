name: Mask Pixel Probe
on:
  push:
    paths:
      - .github/workflows/mask-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Verify exact mask conversion code
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          cat > /tmp/ventura-mask-probe.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          enum ExportError: Error { case render }
          nonisolated enum ForegroundMaskUtilities {
              static func value(at point: CGPoint, in mask: [UInt8], width: Int, height: Int) -> UInt8 {
                  let x = Int(point.x.rounded(.down)), y = Int(point.y.rounded(.down))
                  guard (0..<width).contains(x), (0..<height).contains(y), mask.count == width * height else { return 0 }
                  return mask[y * width + x]
              }
          
              static func adjusted(_ source: [UInt8], width: Int, height: Int, edgeOffset: Int) -> [UInt8] {
                  guard source.count == width * height else { return [] }
                  var result = source
                  for _ in 0..<min(10, abs(edgeOffset)) {
                      result = edgeOffset > 0 ? eroded(result, width: width, height: height)
                                              : dilated(result, width: width, height: height)
                  }
                  return result
              }
          
              /// A one-pixel closing removes isolated pinholes while retaining the outside contour.
              static func closed(_ source: [UInt8], width: Int, height: Int) -> [UInt8] {
                  guard source.count == width * height else { return [] }
                  return eroded(dilated(source, width: width, height: height), width: width, height: height)
              }
          
              static func connectedComponent(in source: [UInt8], width: Int, height: Int, at point: CGPoint) -> [UInt8]? {
                  guard source.count == width * height else { return nil }
                  let x = Int(point.x.rounded(.down)), y = Int(point.y.rounded(.down))
                  guard (0..<width).contains(x), (0..<height).contains(y), source[y * width + x] != 0 else { return nil }
          
                  var result = [UInt8](repeating: 0, count: source.count)
                  var queue = [Int](); queue.reserveCapacity(source.count / 8)
                  var head = 0
                  let start = y * width + x
                  queue.append(start)
                  result[start] = 255
                  while head < queue.count {
                      let index = queue[head]; head += 1
                      let cx = index % width, cy = index / width
                      for dy in -1...1 {
                          for dx in -1...1 where dx != 0 || dy != 0 {
                              let nx = cx + dx, ny = cy + dy
                              guard (0..<width).contains(nx), (0..<height).contains(ny) else { continue }
                              let neighbor = ny * width + nx
                              guard source[neighbor] != 0, result[neighbor] == 0 else { continue }
                              result[neighbor] = 255
                              queue.append(neighbor)
                          }
                      }
                  }
                  return result
              }
          
              static func cgImage(from mask: [UInt8], width: Int, height: Int) throws -> CGImage {
                  guard width > 0, height > 0, mask.count == width * height,
                        let provider = CGDataProvider(data: Data(mask) as CFData) else { throw ExportError.render }
                  guard let image = CGImage(width: width, height: height, bitsPerComponent: 8, bitsPerPixel: 8,
                                            bytesPerRow: width, space: CGColorSpaceCreateDeviceGray(),
                                            bitmapInfo: CGBitmapInfo(rawValue: CGImageAlphaInfo.none.rawValue),
                                            provider: provider, decode: nil, shouldInterpolate: false, intent: .defaultIntent)
                  else { throw ExportError.render }
                  return image
              }
          
              static func grayscaleBytes(from image: CGImage, width: Int, height: Int,
                                         interpolation: CGInterpolationQuality = .none) throws -> [UInt8] {
                  guard width > 0, height > 0 else { throw ExportError.render }
                  let sourceWidth = image.width, sourceHeight = image.height
                  guard let context = CGContext(data: nil, width: sourceWidth, height: sourceHeight,
                                                bitsPerComponent: 8, bytesPerRow: 0,
                                                space: CGColorSpaceCreateDeviceGray(),
                                                bitmapInfo: CGImageAlphaInfo.none.rawValue) else { throw ExportError.render }
                  context.interpolationQuality = .none
                  context.setBlendMode(.copy)
                  // Read at native size: transformed grayscale draws can corrupt their last
                  // row in Core Graphics. Resample the coverage values with clamped edges.
                  context.draw(image, in: CGRect(x: 0, y: 0, width: sourceWidth, height: sourceHeight))
                  guard let data = context.data else { throw ExportError.render }
                  let source = data.assumingMemoryBound(to: UInt8.self)
                  var result = [UInt8](repeating: 0, count: width * height)
                  let scaleX = Double(sourceWidth) / Double(width)
                  let scaleY = Double(sourceHeight) / Double(height)
                  for y in 0..<height {
                      for x in 0..<width {
                          let value: UInt8
                          if width == sourceWidth && height == sourceHeight {
                              value = source[y * context.bytesPerRow + x]
                          } else if interpolation == .none {
                              let sx = min(sourceWidth - 1, Int((Double(x) + 0.5) * scaleX))
                              let sy = min(sourceHeight - 1, Int((Double(y) + 0.5) * scaleY))
                              value = source[sy * context.bytesPerRow + sx]
                          } else {
                              let sx = max(0, min(Double(sourceWidth - 1), (Double(x) + 0.5) * scaleX - 0.5))
                              let sy = max(0, min(Double(sourceHeight - 1), (Double(y) + 0.5) * scaleY - 0.5))
                              let x0 = Int(sx), y0 = Int(sy)
                              let x1 = min(sourceWidth - 1, x0 + 1), y1 = min(sourceHeight - 1, y0 + 1)
                              let fx = sx - Double(x0), fy = sy - Double(y0)
                              let top = Double(source[y0 * context.bytesPerRow + x0]) * (1 - fx)
                                  + Double(source[y0 * context.bytesPerRow + x1]) * fx
                              let bottom = Double(source[y1 * context.bytesPerRow + x0]) * (1 - fx)
                                  + Double(source[y1 * context.bytesPerRow + x1]) * fx
                              value = UInt8(clamping: Int((top * (1 - fy) + bottom * fy).rounded()))
                          }
                          result[y * width + x] = value
                      }
                  }
                  return result
              }
          
              static func binaryImage(from mask: [UInt8], width: Int, height: Int) throws -> CGImage {
                  try cgImage(from: mask.map { $0 >= 128 ? 255 : 0 }, width: width, height: height)
              }
          
              static func rgbaBytes(from image: CGImage, width: Int, height: Int) throws -> [UInt8] {
                  guard width > 0, height > 0 else { throw ExportError.render }
                  guard let context = CGContext(data: nil, width: width, height: height,
                                                bitsPerComponent: 8, bytesPerRow: 0,
                                                space: CGColorSpace(name: CGColorSpace.sRGB)!,
                                                bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue | CGBitmapInfo.byteOrder32Big.rawValue)
                  else { throw ExportError.render }
                  context.interpolationQuality = .none
                  context.setBlendMode(.copy)
                  context.draw(image, in: CGRect(x: 0, y: 0, width: width, height: height))
                  guard let data = context.data else { throw ExportError.render }
                  let source = data.assumingMemoryBound(to: UInt8.self)
                  var result = [UInt8](repeating: 0, count: width * height * 4)
                  for y in 0..<height {
                      for x in 0..<width {
                          let destination = (y * width + x) * 4
                          let sourceOffset = y * context.bytesPerRow + x * 4
                          result[destination] = source[sourceOffset]
                          result[destination + 1] = source[sourceOffset + 1]
                          result[destination + 2] = source[sourceOffset + 2]
                          result[destination + 3] = source[sourceOffset + 3]
                      }
                  }
                  return result
              }
          
              private static func eroded(_ mask: [UInt8], width: Int, height: Int) -> [UInt8] {
                  var result = mask
                  for y in 0..<height {
                      for x in 0..<width where mask[y * width + x] != 0 {
                          var keep = true
                          for ny in max(0, y - 1)...min(height - 1, y + 1) {
                              for nx in max(0, x - 1)...min(width - 1, x + 1) where mask[ny * width + nx] == 0 {
                                  keep = false
                              }
                          }
                          result[y * width + x] = keep ? 255 : 0
                      }
                  }
                  return result
              }
          
              private static func dilated(_ mask: [UInt8], width: Int, height: Int) -> [UInt8] {
                  var result = mask
                  for y in 0..<height {
                      for x in 0..<width where mask[y * width + x] == 0 {
                          var fill = false
                          for ny in max(0, y - 1)...min(height - 1, y + 1) {
                              for nx in max(0, x - 1)...min(width - 1, x + 1) where mask[ny * width + nx] != 0 {
                                  fill = true
                              }
                          }
                          if fill { result[y * width + x] = 255 }
                      }
                  }
                  return result
              }
          }
          
          
          let pixels: [UInt8] = [255, 0, 0, 0, 128, 0, 0, 0, 0, 0, 0, 64]
          let input = try ForegroundMaskUtilities.cgImage(from: pixels, width: 3, height: 4)
          let native = try ForegroundMaskUtilities.grayscaleBytes(from: input, width: 3, height: 4)
          precondition(native == pixels, "Native rows differ")
          let enlarged = try ForegroundMaskUtilities.grayscaleBytes(from: input, width: 6, height: 8)
          for y in 0..<8 { for x in 0..<6 {
              precondition(enlarged[y * 6 + x] == pixels[(y / 2) * 3 + x / 2], "Scaled pixel differs")
          } }
          let smooth = try ForegroundMaskUtilities.grayscaleBytes(from: input, width: 6, height: 8, interpolation: .high)
          precondition(smooth[0] == 255 && smooth[47] == 64, "Smooth corners differ")
          let single = try ForegroundMaskUtilities.cgImage(from: [64], width: 1, height: 1)
          for quality: CGInterpolationQuality in [.none, .high] {
              let scaled = try ForegroundMaskUtilities.grayscaleBytes(from: single, width: 7, height: 3, interpolation: quality)
              precondition(scaled == [UInt8](repeating: 64, count: 21), "Single pixel scaling differs")
          }
          print("PASS: native rows, nearest scaling, bilinear edges, single-pixel scaling")
          
          SWIFT
          swiftc -O -target arm64-apple-macos13.0 /tmp/ventura-mask-probe.swift -o /tmp/ventura-mask-probe
          /tmp/ventura-mask-probe
          swiftc -Onone -target arm64-apple-macos13.0 /tmp/ventura-mask-probe.swift -o /tmp/ventura-mask-probe-debug
          /tmp/ventura-mask-probe-debug
