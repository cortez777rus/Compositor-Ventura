name: Ventura Build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ventura-build.yml
      - patches/**
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/ventura-build.yml
      - patches/**
      - scripts/**

permissions:
  contents: read

concurrency:
  group: ventura-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check embedded patch and scripts
        run: |
          python3 scripts/sync-workflow-patch.py --check
          bash -n scripts/prepare-source.sh
          python3 -m py_compile scripts/*.py

      - name: Checkout pinned upstream source
        uses: actions/checkout@v7
        with:
          repository: robbietilton/Compositor
          ref: b31ea029762ecb782699df971e1412168602a44d
          path: upstream
          persist-credentials: false

      - name: Apply and validate source
        run: |
          git -C upstream apply --check "$GITHUB_WORKSPACE/patches/ventura-1.5.5.patch"
          git -C upstream apply --binary "$GITHUB_WORKSPACE/patches/ventura-1.5.5.patch"
          python3 scripts/check-prepared-source.py upstream

  build:
    needs: validate-source
    runs-on: macos-26
    timeout-minutes: 60
